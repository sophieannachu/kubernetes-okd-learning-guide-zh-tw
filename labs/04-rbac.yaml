apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-reader
  namespace: k8s-book-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-log-reader
  namespace: k8s-book-lab
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - pods/log
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: log-reader-binding
  namespace: k8s-book-lab
subjects:
- kind: ServiceAccount
  name: log-reader
  namespace: k8s-book-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-log-reader
